<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#CFEAFB">
<meta name="description" content="Kwords: a short word of the day for ages 3 and 4. Listen, trace with a finger or stylus, find the picture, build the word, then colour.">
<title>Kwords</title>
<script>
/* ==================================================================
   KWORDS SETTINGS: the only part you need to edit.
   Leave supabaseUrl and supabaseKey empty to run fully offline:
   progress stays on each device. Kid comparisons (percentiles),
   the feedback inbox and the internal report need the database:
   run kwords-setup.sql in Supabase, then paste your two values here.
   ================================================================== */
window.KWORDS_CONFIG = window.KWORDS_CONFIG || {
  appName: "Kwords",
  supabaseUrl: "",   // e.g. "https://abcdefghijkl.supabase.co"
  supabaseKey: ""    // Project Settings > API Keys > publishable key (sb_publishable_...) or legacy anon key
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FFC43D'/%3E%3Cpath d='M20 12v40M44 26L22 40l24 14' fill='none' stroke='%2326315C' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --sky:#CFEAFB; --sky-2:#B6DDF7; --sky-3:#E6F4FD;
  --paper:#FFFFFF;
  --ink:#26315C; --ink-2:#55608A; --ink-3:#8790B0;
  --rule-blue:#8FBDEB; --rule-red:#EE5A5F;
  --sun:#FFC43D; --leaf:#4CC27A; --grape:#A58BFA; --tomato:#F37370; --bubble:#FF9CC8; --sea:#6EC3F4;
  --stamp:#E3404C;
  --f-display:"Grandstander","Baloo 2","Comic Sans MS","Chalkboard SE",ui-rounded,system-ui,sans-serif;
  --f-body:"Andika","Comic Sans MS","Chalkboard SE",ui-rounded,system-ui,sans-serif;
  --lift:0 5px 0 var(--ink);
  --lift-sm:0 3px 0 var(--ink);
  /* grown-up area */
  --g-bg:#F1F5F9; --g-card:#FFFFFF; --g-line:#DCE3EC; --g-ink:#1F2A44; --g-ink-2:#4F5B76; --g-ink-3:#7A869E;
  --c-kid:#2a78d6; --c-kid-track:#cde2fb; --c-avg:#9A9993; --c-2:#eb6834; --c-3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  font-family:var(--f-body); font-size:18px; line-height:1.4; color:var(--ink);
  background:var(--sky);
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  touch-action:pan-x pan-y; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{display:block}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;
  padding:max(12px,env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));}
.col{width:100%;max-width:620px;display:flex;flex-direction:column;align-items:stretch;gap:16px}
.center{text-align:center}
.no-select,.screen.kid,.lesson,.paint{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- sticker buttons (kid side) ---------- */
.btn{
  font-family:var(--f-display); font-weight:800; font-size:22px; letter-spacing:.2px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:58px; padding:10px 24px; border:3px solid var(--ink); border-radius:20px;
  background:var(--paper); color:var(--ink); box-shadow:var(--lift);
  transition:transform .07s ease, box-shadow .07s ease, filter .15s;
  touch-action:manipulation; text-decoration:none;
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:var(--lift-sm)}
.btn.sun{background:var(--sun)} .btn.leaf{background:var(--leaf)} .btn.grape{background:var(--grape)}
.btn.tomato{background:var(--tomato)} .btn.bubble{background:var(--bubble)} .btn.sea{background:var(--sea)}
.btn.big{font-size:28px;min-height:72px;padding:12px 34px;border-radius:24px}
.btn.small{font-size:17px;min-height:44px;padding:6px 14px;border-radius:14px;box-shadow:var(--lift-sm)}
.btn.small:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.block{width:100%}
.btn svg{flex:none}
.icon-btn{
  width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);
  display:inline-grid;place-items:center;box-shadow:var(--lift-sm);flex:none;padding:0;
  transition:transform .07s, box-shadow .07s; touch-action:manipulation;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn.sm{width:46px;height:46px}
.icon-btn.sun{background:var(--sun)} .icon-btn.leaf{background:var(--leaf)}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(6px)}}
.bounce{animation:bounce .6s}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.15)}60%{transform:scale(.95)}100%{transform:scale(1)}}

/* ---------- kid top bar ---------- */
.kid-top{width:100%;max-width:620px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.who{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:4px 16px 4px 4px;box-shadow:var(--lift-sm);font-family:var(--f-display);font-weight:800;font-size:20px;min-height:52px}
.who .avatar{width:42px;height:42px;font-size:26px;border-width:0}
.star-chip{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:20px;
  background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:var(--lift-sm);min-height:52px}
.spacer{flex:1}
.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:52px;border:3px solid var(--ink);flex:none}

/* ---------- logo ---------- */
.logo{display:flex;justify-content:center}
.logo svg{height:64px;width:auto}

/* ---------- word card (hero) ---------- */
.word-card{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink);
  padding:18px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
.word-card .label{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--ink-2)}
.word-card .pic{font-size:clamp(110px,32vw,150px);margin:2px 0 0;filter:drop-shadow(0 4px 0 rgba(38,49,92,.12))}
.word-svg{width:100%;max-width:520px;height:auto}
.word-card .word-svg{max-height:min(270px,36vh)}
.word-card .actions{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.word-card .done-note{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink-2)}
.stamp100{position:absolute;right:14px;top:14px;width:96px;height:96px;transform:rotate(-14deg);pointer-events:none}
.stamp100.in{animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:rotate(-14deg) scale(2.2);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:1}}

/* ---------- home tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:132px;
  border:3px solid var(--ink);border-radius:26px;box-shadow:var(--lift);font-family:var(--f-display);font-weight:800;font-size:22px;
  color:var(--ink);text-decoration:none;transition:transform .07s, box-shadow .07s;padding:12px}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile .emoji{font-size:52px}
.tile.grape{background:var(--grape)} .tile.bubble{background:var(--bubble)}
.week{display:flex;justify-content:space-between;gap:6px;background:rgba(255,255,255,.55);border-radius:22px;padding:12px 14px}
.week .day{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--ink-2);flex:1}
.week .dot{width:38px;height:38px;border-radius:50%;border:3px dashed var(--ink-3);display:grid;place-items:center;font-size:20px;background:transparent}
.week .day.done .dot{border:3px solid var(--ink);background:var(--sun)}
.week .day.today .dot{outline:3px solid var(--paper);outline-offset:2px}
.week-label{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink-2);margin:0 4px -8px}
.grown-link{align-self:center;background:none;border:0;color:var(--ink-2);font-weight:700;font-size:16px;padding:10px 14px;display:flex;gap:8px;align-items:center;border-radius:12px}

/* ---------- picker / onboarding ---------- */
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.kid-btn{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:26px;
  box-shadow:var(--lift);padding:18px 10px;font-family:var(--f-display);font-weight:800;font-size:22px;transition:transform .07s, box-shadow .07s}
.kid-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.kid-btn.add{background:transparent;border-style:dashed;box-shadow:none;color:var(--ink-2)}
h1.kid-title{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);text-align:center;margin:6px 0}
.sheet-card{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:var(--lift);padding:20px}
.choice-row{display:flex;gap:10px;flex-wrap:wrap}
.choice{flex:1;min-width:90px;min-height:58px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);
  font-family:var(--f-display);font-weight:800;font-size:22px;box-shadow:var(--lift-sm);padding:8px 12px}
.choice[aria-pressed="true"]{background:var(--sun)}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatar-grid button{aspect-ratio:1;border-radius:50%;border:3px solid transparent;font-size:30px;display:grid;place-items:center;padding:0}
.avatar-grid button[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--lift-sm)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > span,.field > label{font-weight:700;font-size:16px;color:var(--ink-2)}
.input{width:100%;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:20px;background:var(--paper)}

/* ---------- lesson ---------- */
.lesson{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--sky);
  padding:max(10px,env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom))}
.lesson-top{display:flex;align-items:center;gap:12px;width:100%;max-width:760px;margin:0 auto 10px}
.steps{flex:1;display:flex;justify-content:center;gap:8px}
.steps i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.steps i.on{background:var(--sun);transform:scale(1.25)}
.steps i.done{background:var(--leaf)}
.lesson-body{flex:1;min-height:0;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet{flex:1;min-height:0;background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;position:relative;overflow:hidden}
.prompt{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5.4vw,30px);text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px}
.prompt b{font-family:var(--f-body);font-weight:700;font-size:1.15em;color:var(--ink)}
.lesson-bar{display:flex;align-items:flex-end;gap:12px;width:100%;max-width:760px;margin:12px auto 0}
.voice-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink)}
.voice-btn .face{width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);box-shadow:var(--lift-sm);display:grid;place-items:center;overflow:hidden;transition:transform .07s, box-shadow .07s}
.voice-btn:active .face{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.voice-btn.guy .face{background:#9ED0F5} .voice-btn.girl .face{background:#FFC4DE}
.voice-btn.speaking .face{outline:4px solid var(--sun);outline-offset:2px}
.listen-pic{font-size:clamp(120px,34vh,220px)}
.listen-word{width:100%;max-width:640px}
.trace-wrap{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;gap:8px}
.trace-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.trace-host{flex:1;min-height:220px;width:100%;position:relative}
.trace-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.trace-tools{display:flex;gap:10px;align-items:center}
.crayons{display:flex;gap:8px}
.crayons button{width:34px;height:34px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--ink);padding:0}
.crayons button[aria-pressed="true"]{transform:scale(1.18);box-shadow:0 0 0 3px var(--ink)}
.mini-word{height:46px;width:auto}
.find-grid{display:grid;gap:14px;width:100%;max-width:640px;grid-template-columns:repeat(var(--n,3),1fr)}
.pick-card{aspect-ratio:1;border:3px solid var(--ink);border-radius:26px;background:var(--paper);box-shadow:var(--lift);
  display:grid;place-items:center;transition:transform .07s, box-shadow .07s;padding:0;container-type:inline-size;overflow:hidden}
.pick-card .pc-emoji{font-size:64px;font-size:60cqw;line-height:1}
.pick-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pick-card.right{background:#DDF6E6;border-color:#1F8A4C;box-shadow:0 5px 0 #1F8A4C}
.pick-card.faded{opacity:.35}
.review-tag{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink-2);background:var(--sky-3);border-radius:999px;padding:4px 12px}
.build-pic{font-size:clamp(84px,22vh,130px)}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{width:clamp(52px,14vw,74px);height:clamp(64px,17vw,88px);border-bottom:5px solid var(--rule-red);display:grid;place-items:center;
  font-family:var(--f-body);font-weight:700;font-size:clamp(44px,12vw,64px);color:var(--ink);background:linear-gradient(to bottom,transparent 49%,var(--sky-3) 49%,var(--sky-3) 51%,transparent 51%)}
.slot.next{background-color:#FFF5D6}
.tiles-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.letter-tile{width:clamp(58px,15vw,80px);height:clamp(58px,15vw,80px);border:3px solid var(--ink);border-radius:18px;background:var(--sun);
  box-shadow:var(--lift);font-family:var(--f-body);font-weight:700;font-size:clamp(36px,10vw,50px);display:grid;place-items:center;padding:0;
  transition:transform .07s, box-shadow .07s, opacity .2s}
.letter-tile:nth-child(3n+2){background:#9ED0F5} .letter-tile:nth-child(3n){background:#B9EBC9}
.letter-tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.letter-tile.used{opacity:0;pointer-events:none}

/* ---------- celebrate ---------- */
.celebrate{position:fixed;inset:0;z-index:50;background:rgba(207,234,251,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;gap:14px;text-align:center}
.celebrate canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.big-title{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,78px);line-height:1;margin:0;color:var(--ink);
  text-shadow:0 4px 0 var(--sun)}
.celebrate .stamp-wrap{position:relative;width:150px;height:150px}
.celebrate .stamp100{position:static;width:150px;height:150px}
.star-row{display:flex;gap:10px}
.star-row svg{width:58px;height:58px}
.star-row .pop{animation:pop .4s cubic-bezier(.2,1.8,.4,1) both}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.sticker-reveal{display:flex;align-items:center;gap:14px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:10px 20px 10px 12px;box-shadow:var(--lift)}
.sticker-reveal .sticker{width:76px;height:76px;font-size:44px}
.celebrate .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- stickers ---------- */
.sticker-book{background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:var(--lift);padding:18px}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:14px}
.sticker{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:40px;background:#fff;
  box-shadow:0 0 0 4px #fff, 0 0 0 6px rgba(38,49,92,.18), 0 6px 10px rgba(38,49,92,.18);border:0;padding:0}
.sticker.locked{background:var(--sky-3);box-shadow:none;border:3px dashed var(--ink-3);color:var(--ink-3);font-family:var(--f-display);font-weight:800;font-size:26px}

/* ---------- colouring ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.book{display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:8px 22px 22px 8px;box-shadow:var(--lift);overflow:hidden;
  text-decoration:none;color:var(--ink);position:relative;transition:transform .07s, box-shadow .07s;background:var(--paper)}
.book:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(38,49,92,.22);z-index:1}
.book .cover{aspect-ratio:4/5;display:grid;place-items:center;padding:10px 10px 10px 22px}
.book .cover img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:6px;border:2px solid var(--ink)}
.book .title{font-family:var(--f-display);font-weight:800;font-size:19px;padding:8px 10px 10px 22px;background:var(--paper);border-top:3px solid var(--ink)}
.pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.page-thumb{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--lift);padding:8px;display:flex;flex-direction:column;gap:6px;
  align-items:center;transition:transform .07s, box-shadow .07s;font-family:var(--f-display);font-weight:800;font-size:18px}
.page-thumb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.page-thumb img{width:100%;aspect-ratio:4/5;object-fit:contain;border-radius:10px}
.paint{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--sky);
  padding:max(8px,env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}
.paint-top{display:flex;align-items:center;gap:8px;width:100%;max-width:1000px;margin:0 auto 8px}
.paint-top .title{flex:1;font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paint-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:1100px;margin:0 auto}
.paint-stage{flex:1;min-height:0;min-width:0;display:grid;place-items:center}
.paint-wrap{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:var(--lift);overflow:hidden;touch-action:none}
.paint-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.paint-wrap canvas.lines{pointer-events:none}
.paint-wrap .loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--ink-2)}
.paint-dock{display:flex;flex-direction:column;gap:8px;width:100%;max-width:1000px;margin:0 auto}
.tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.tool{min-width:62px;height:58px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:var(--lift-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:var(--f-display);font-weight:700;font-size:13px;padding:2px 8px}
.tool[aria-pressed="true"]{background:var(--sun);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tool .dot{border-radius:50%;background:var(--ink)}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:8px 6px;padding:6px 4px 4px;width:100%;max-width:470px;margin:0 auto}
.swatch{justify-self:center;width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);padding:0;box-shadow:var(--lift-sm);transition:transform .1s}
.swatch[aria-pressed="true"]{transform:scale(1.1);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.swatch.rainbow{background:conic-gradient(#F2453D,#FF8A1F,#FFD12E,#2EAD5B,#3DA5F5,#8B5CF6,#F2453D)}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .paint-body{flex-direction:row;align-items:stretch}
  .paint-dock{width:auto;max-width:300px;justify-content:center;margin:0}
  .paint-dock .tools{justify-content:flex-start}
  .palette{grid-template-columns:repeat(4,1fr);max-width:236px;margin:0}
}

/* ---------- modal + toast ---------- */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(38,49,92,.45);display:grid;place-items:center;padding:20px}
.modal{width:100%;max-width:420px;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:22px;text-align:center}
.modal h2{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0 0 6px}
.modal p{margin:0 0 16px;color:var(--ink-2)}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.gate-q{font-family:var(--f-display);font-weight:800;font-size:34px;margin:10px 0 16px}
#toast-root{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:90;pointer-events:none}
.toast{background:var(--g-ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:16px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastin .25s}
@keyframes toastin{from{transform:translateY(20px);opacity:0}}

/* ---------- grown-ups area ---------- */
.grown{background:var(--g-bg);color:var(--g-ink);font-size:16px;align-items:stretch;padding-left:0;padding-right:0}
.grown .g-head{width:100%;background:var(--g-card);border-bottom:1px solid var(--g-line);position:sticky;top:0;z-index:5}
.grown .g-head-in{max-width:880px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.g-row{display:flex;align-items:center;gap:10px}
.g-title{font-family:var(--f-display);font-weight:800;font-size:22px;flex:1}
.g-btn{border:1px solid var(--g-line);background:var(--g-card);color:var(--g-ink);border-radius:12px;padding:9px 14px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;min-height:42px}
.g-btn:hover{background:#F7F9FC}
.g-btn.primary{background:var(--g-ink);color:#fff;border-color:var(--g-ink)}
.g-btn.danger{color:var(--crit);border-color:#F1C9C9}
.g-btn:disabled{opacity:.5}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;font-size:15px;color:var(--g-ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--g-ink);border-bottom-color:var(--c-kid)}
.g-body{width:100%;max-width:880px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
.g-card{background:var(--g-card);border:1px solid var(--g-line);border-radius:16px;padding:18px}
.g-card h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0 0 4px}
.g-card h3{font-size:16px;margin:0 0 6px}
.g-card .sub{color:var(--g-ink-2);margin:0 0 14px;font-size:15px}
.g-note{color:var(--g-ink-2);font-size:14px}
.kid-switch{display:flex;gap:8px;flex-wrap:wrap}
.kid-switch button{display:flex;align-items:center;gap:8px;border:1px solid var(--g-line);background:var(--g-card);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700}
.kid-switch button[aria-pressed="true"]{border-color:var(--c-kid);box-shadow:inset 0 0 0 1px var(--c-kid)}
.kid-switch .avatar{width:32px;height:32px;font-size:19px;border-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--g-card);border:1px solid var(--g-line);border-radius:14px;padding:14px}
.kpi .k-label{font-size:14px;color:var(--g-ink-2)}
.kpi .k-value{font-size:30px;font-weight:700;line-height:1.15;margin-top:4px}
.kpi .k-sub{font-size:13px;color:var(--g-ink-3);margin-top:2px}
.hero-pct{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero-pct .num{font-size:56px;font-weight:700;line-height:1}
.hero-pct .txt{flex:1;min-width:200px;color:var(--g-ink-2)}
.pct-list{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.pct-row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pct-row .name{font-weight:700}
.pct-row .val{color:var(--g-ink-2);font-size:14px}
.meter{position:relative;height:12px;border-radius:6px;background:var(--c-kid-track);margin:8px 0 4px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c-kid)}
.meter .mid{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--g-ink-3);left:50%}
.pct-row .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--g-ink-3)}
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);fill:var(--g-ink-3);font-size:12px}
.chart .axis{stroke:#C9CFD9;stroke-width:1}
.chart .grid{stroke:#ECEFF4;stroke-width:1}
.chart .end-label{fill:var(--g-ink);font-size:13px;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--g-ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.legend i.box{height:12px;width:12px;border-radius:3px}
.tooltip{position:absolute;pointer-events:none;background:var(--g-card);border:1px solid var(--g-line);border-radius:10px;padding:8px 10px;
  box-shadow:0 6px 18px rgba(31,42,68,.14);font-size:13px;white-space:nowrap;z-index:3;transform:translate(-50%,-100%)}
.tooltip .t-row{display:flex;align-items:center;gap:8px}
.tooltip .t-row b{font-size:14px}
.tooltip .t-key{width:12px;height:3px;border-radius:2px}
.tooltip .t-head{color:var(--g-ink-3);margin-bottom:4px}
.table-toggle{background:none;border:0;color:var(--c-kid);font-weight:700;font-size:14px;padding:6px 0;margin-top:6px}
table.g-table{width:100%;border-collapse:collapse;font-size:14px}
.g-table th{text-align:left;color:var(--g-ink-3);font-weight:700;border-bottom:1px solid var(--g-line);padding:8px 6px}
.g-table td{border-bottom:1px solid #EEF1F5;padding:8px 6px;font-variant-numeric:tabular-nums}
.table-scroll{overflow-x:auto}
.g-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.g-field > span{font-weight:700;font-size:14px;color:var(--g-ink-2)}
.g-input,.g-select,.g-textarea{width:100%;border:1px solid #C9D2DE;border-radius:12px;padding:11px 12px;background:#fff;font-size:16px;color:var(--g-ink)}
.g-textarea{min-height:110px;resize:vertical}
.g-check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #EEF1F5}
.g-check:last-child{border-bottom:0}
.g-check input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--g-ink)}
.g-check .lbl{font-weight:700}
.g-check .hint{display:block;color:var(--g-ink-2);font-size:14px;font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.seg button{border:1px solid #C9D2DE;border-radius:999px;background:#fff;padding:8px 15px;font-weight:700;font-size:15px;color:var(--g-ink-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--g-ink);border-color:var(--g-ink);color:#fff}
.g-kid-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EEF1F5;flex-wrap:wrap}
.g-kid-row .avatar{width:44px;height:44px;font-size:26px;border-width:0}
.g-kid-row .meta{flex:1;min-width:140px}
.g-kid-row .meta small{display:block;color:var(--g-ink-2)}
.board{display:flex;flex-direction:column;gap:10px}
.board-item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--g-line);border-radius:14px;padding:12px}
.vote{display:flex;flex-direction:column;align-items:center;min-width:54px;border:1px solid var(--g-line);border-radius:12px;background:#fff;padding:6px 4px;font-weight:700}
.vote[aria-pressed="true"]{border-color:var(--c-kid);color:var(--c-kid);background:#F2F7FE}
.board-item .b-main{flex:1;min-width:0}
.board-item .b-title{font-weight:700}
.board-item .b-note{color:var(--g-ink-2);font-size:14px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:#EEF1F5;color:var(--g-ink-2)}
.badge.planned{background:#E8F0FD;color:#1C5CAB}
.badge.building{background:#FFF3D9;color:#8A5A00}
.badge.done{background:#E3F6E3;color:#0B6B0B}
.badge.declined{background:#F4F4F4;color:#6B6B6B}
.badge.new{background:#F1ECFF;color:#5B3FC4}
.banner{border-radius:14px;padding:12px 14px;background:#FFF6E0;border:1px solid #F4D58A;color:#6B4A00;font-size:15px}
.banner.info{background:#EEF5FE;border-color:#C8DDF8;color:#1C4E8F}
.steps-list{margin:0;padding-left:20px}
.steps-list li{margin:6px 0}
code{background:#EEF1F5;border-radius:6px;padding:1px 6px;font-size:14px}
.inbox-item{border-top:1px solid var(--g-line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.inbox-item:first-child{border-top:0}
.inbox-item .meta{font-size:13px;color:var(--g-ink-3)}
.inbox-item .details{white-space:pre-wrap;color:var(--g-ink-2);font-size:15px}
.inbox-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small-multiples{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}

/* ---------- motion & print ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
#print-root{display:none}
@media print{
  @page{margin:10mm}
  body{background:#fff}
  body > *:not(#print-root){display:none !important}
  #print-root{display:block !important}
  #print-root img{width:100%;height:auto;max-height:265mm;object-fit:contain}
}

/* ---------- portrait phones: stack the picture cards so they're big targets ---------- */
@media (orientation:portrait) and (max-width:700px){
  .find-grid{grid-template-columns:min(44vw,19.5vh);justify-content:center;gap:12px}
  .find-grid[data-n="2"]{grid-template-columns:min(56vw,27vh)}
}
/* ---------- landscape layouts ---------- */
@media (orientation:landscape) and (min-width:820px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start;max-width:1100px}
  .home-grid > .word-card{grid-column:1;grid-row:1 / span 3}
  .home-grid > :not(.word-card){grid-column:2}
  .home-grid .tiles{grid-template-columns:1fr}
  .home-grid .week-label{margin-top:4px}
  .kid-top{max-width:1100px}
}
@media (orientation:landscape) and (max-height:560px){
  .screen{padding-top:8px}
  .kid-top{margin-bottom:8px}
  .word-card .pic{font-size:22vh}
  .tile{min-height:96px}
  .lesson{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:12px;padding-top:6px;padding-bottom:8px}
  .lesson-top{grid-column:1 / -1;margin-bottom:6px;max-width:none}
  .lesson-top .icon-btn.sm{width:42px;height:42px}
  .lesson-body{grid-column:1;grid-row:2;max-width:none}
  .lesson-bar{grid-column:2;grid-row:2;flex-direction:column;align-items:center;justify-content:flex-start;margin:0;width:auto;gap:8px}
  .lesson-bar .spacer{flex:1}
  .lesson-bar .btn.big{min-height:58px;padding:8px 18px}
  .voice-btn .face{width:50px;height:50px}
  .voice-btn .face svg{width:44px;height:44px}
  .sheet{padding:8px 12px;border-radius:22px}
  .prompt{font-size:20px;min-height:0}
  .trace-wrap{flex-direction:row;position:relative}
  .trace-head{position:absolute;left:4px;top:2px;z-index:1;pointer-events:none;gap:12px}
  .trace-head .mini-word{height:34px}
  .sheet > .trace-wrap > .prompt{position:absolute;left:8px;top:0;z-index:1;font-size:18px;pointer-events:none}
  .trace-host{min-height:110px}
  .trace-tools{flex-direction:column;justify-content:flex-start;gap:8px}
  .trace-tools .spacer{flex:1}
  .trace-tools .crayons{flex-direction:column}
  .trace-tools .icon-btn{width:46px;height:46px}
  .word-card .pic{font-size:15vh}
  .word-card .word-svg{max-height:26vh}
  .word-card .label{font-size:16px}
  .word-card{padding:10px 14px 14px}
  .btn.big{min-height:60px;font-size:24px}
  .listen-sheet{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
  .listen-pic{font-size:30vh}
  .listen-word{width:52%;max-width:420px}
  .find-grid{grid-template-columns:repeat(var(--n),min(30vh,170px));justify-content:center}
  .build-pic{font-size:15vh}
  .slot{height:58px}
  .tiles-row{margin-top:8px}
  .letter-tile{width:58px;height:58px}
  .celebrate{gap:8px}
  .celebrate .stamp-wrap,.celebrate .stamp100{width:96px;height:96px}
  .big-title{font-size:44px}
}

/* Tiny DOM builder. Strings become text nodes, so user text is never parsed as HTML. */

/* ---------- local storage ----------
   Everything a family creates lives on this device. Children's names never leave it;
   the optional database only receives an anonymous id, the age group and lesson numbers. */
const Store = {
  KEY: 'kwords.v1',
  d: null,
  defaults() {
    return {
      v: 1,
      familyId: uuid(),
      createdAt: Date.now(),
      settings: {
        narrator: 'girl', voiceGuy: '', voiceGirl: '', pitchGuy: 1, pitchGirl: 1, rate: 0.9,
        zed: /-(CA|GB|AU|NZ|IE|IN|ZA)$/i.test(navigator.language || ''),
        volume: 0.8, stylusOnly: false, wordsPerDay: 1, extraWords: true,
      },
      kids: [],
      activeKid: null,
      progress: {},
      outbox: [],
      feedback: [],
      compare: {},
    };
  },
  load() {
    let parsed = null;
    try { parsed = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { parsed = null; }
    const base = this.defaults();
    this.d = parsed ? Object.assign(base, parsed) : base;
    this.d.settings = Object.assign(this.defaults().settings, (parsed && parsed.settings) || {});
    for (const k of this.d.kids) this.ensureProgress(k);
    this.save();
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); }
    catch (e) { console.warn('[kwords] could not save', e); }
  },
  ensureProgress(kid) {
    if (!this.d.progress[kid.id]) {
      this.d.progress[kid.id] = { cursor: levelStart(kid.level || 1), plan: null, sessions: [], stickers: [] };
    }
    return this.d.progress[kid.id];
  },
};

const Kids = {
  all() { return Store.d.kids; },
  get(id) { return Store.d.kids.find((k) => k.id === id) || null; },
  active() { return this.get(Store.d.activeKid) || Store.d.kids[0] || null; },
  setActive(id) { Store.d.activeKid = id; Store.save(); },
  add({ name, age, avatar, level }) {
    const kid = { id: uuid(), name: String(name || 'Me').trim().slice(0, 24) || 'Me', age: age === 3 ? 3 : 4, avatar: avatar || AVATARS[0][0],
      level: level || 1, traceMode: 'auto', createdAt: Date.now() };
    Store.d.kids.push(kid);
    Store.ensureProgress(kid);
    Store.d.activeKid = kid.id;
    Store.save();
    Cloud.queueKid(kid);
    return kid;
  },
  update(id, patch) {
    const kid = this.get(id); if (!kid) return;
    const ageChanged = patch.age && patch.age !== kid.age;
    Object.assign(kid, patch);
    if (patch.level) {
      const p = Store.ensureProgress(kid);
      const learned = Stats.learnedSet(kid);
      if (!learned.size) { p.cursor = levelStart(patch.level); p.plan = null; }
    }
    Store.save();
    if (ageChanged) Cloud.queueKid(kid);
  },
  remove(id) {
    Store.d.kids = Store.d.kids.filter((k) => k.id !== id);
    delete Store.d.progress[id];
    delete Store.d.compare[id];
    Store.d.outbox = Store.d.outbox.filter((x) => x.kid !== id);
    if (Store.d.activeKid === id) Store.d.activeKid = Store.d.kids[0] ? Store.d.kids[0].id : null;
    Store.save();
    Cloud.queueDelete(id);
  },
  resetProgress(id) {
    const kid = this.get(id); if (!kid) return;
    Store.d.progress[id] = null;
    Store.ensureProgress(kid);
    delete Store.d.compare[id];
    Store.d.outbox = Store.d.outbox.filter((x) => x.kid !== id);
    Store.save();
    Cloud.queueDelete(id);
    Cloud.queueKid(kid);
  },
  traceMode(kid) {
    if (kid.traceMode && kid.traceMode !== 'auto') return kid.traceMode;
    return kid.age === 3 ? 'first' : 'each';
  },
};

/* ---------- daily plan ---------- */
const Plan = {
  today(kid) {
    const p = Store.ensureProgress(kid);
    const date = localDate();
    if (!p.plan || p.plan.date !== date) {
      const n = clamp(Store.d.settings.wordsPerDay | 0, 1, 3);
      const words = [];
      for (let i = 0; i < n; i++) words.push(this.wordAfter(kid, p.cursor + i));
      p.plan = { date, words, done: [] };
      Store.save();
    }
    return p.plan;
  },
  /* the next word index in the sequence; after the last word, loop through learned words for review */
  wordAfter(kid, idx) {
    if (idx < WORDS.length) return idx;
    return (idx - WORDS.length) % WORDS.length;
  },
  next(kid) {
    const plan = this.today(kid);
    const left = plan.words.filter((w) => !plan.done.includes(w));
    return left.length ? WORDS[left[0]] : null;
  },
  addExtra(kid) {
    const p = Store.ensureProgress(kid);
    const plan = this.today(kid);
    const lastIdx = Math.max(p.cursor - 1, ...plan.words);
    const idx = this.wordAfter(kid, lastIdx + 1);
    if (!plan.words.includes(idx)) plan.words.push(idx);
    Store.save();
    return WORDS[idx];
  },
  complete(kid, word, result) {
    const p = Store.ensureProgress(kid);
    const plan = this.today(kid);
    const isNew = !result.practice;
    const session = {
      session_id: uuid(),
      session_date: localDate(),
      word: word.w,
      level: word.level,
      mastered: isNew,
      stars: result.stars,
      trace_accuracy: result.trace == null ? null : Math.round(result.trace * 1000) / 1000,
      first_try: result.firstTry,
      build_errors: result.buildErrors,
      seconds: Math.round(result.seconds),
    };
    p.sessions.push(session);
    let sticker = null;
    if (isNew) {
      if (!plan.done.includes(word.i)) plan.done.push(word.i);
      if (this.wordAfter(kid, p.cursor) === word.i) p.cursor += 1;
      else p.cursor = Math.max(p.cursor, word.i + 1);
      sticker = this.awardSticker(kid);
    }
    Store.save();
    Cloud.queueSession(kid, session);
    return { session, sticker };
  },
  awardSticker(kid) {
    const p = Store.ensureProgress(kid);
    const order = shuffle(STICKERS.map((_, i) => i), seeded(kid.id));
    const nextIdx = order.find((i) => !p.stickers.includes(i));
    const idx = nextIdx == null ? order[p.stickers.length % order.length] : nextIdx;
    p.stickers.push(idx);
    return STICKERS[idx];
  },
};

/* ---------- numbers for the grown-up dashboard ---------- */
const Stats = {
  sessions(kid) { return (Store.d.progress[kid.id] || { sessions: [] }).sessions; },
  learnedSet(kid) { return new Set(this.sessions(kid).filter((s) => s.mastered).map((s) => s.word)); },
  learnedWords(kid) {
    const seen = new Map();
    for (const s of this.sessions(kid)) if (s.mastered && !seen.has(s.word)) seen.set(s.word, s.session_date);
    return [...seen.entries()].map(([w, d]) => ({ w, d }));
  },
  forKid(kid) {
    const ss = this.sessions(kid);
    const p = Store.ensureProgress(kid);
    const days = [...new Set(ss.map((s) => s.session_date))].sort();
    const traces = ss.map((s) => s.trace_accuracy).filter((x) => x != null);
    const tries = ss.map((s) => s.first_try).filter((x) => x != null);
    const today = localDate();
    let streak = 0;
    const daySet = new Set(days);
    let cursor = daySet.has(today) ? today : addDays(today, -1);
    while (daySet.has(cursor)) { streak++; cursor = addDays(cursor, -1); }
    const learned = this.learnedWords(kid);
    const first = days[0] || null;
    const curve = [];
    if (first) {
      const span = Math.max(0, daysBetween(first, today));
      const byDay = learned.map((x) => daysBetween(first, x.d)).sort((a, b) => a - b);
      let j = 0;
      for (let d = 0; d <= span; d++) { while (j < byDay.length && byDay[j] <= d) j++; curve.push([d, j]); }
    }
    return {
      words: learned.length,
      days: days.length,
      streak,
      stars: ss.reduce((a, s) => a + (s.stars || 0), 0),
      minutes: ss.reduce((a, s) => a + (s.seconds || 0), 0) / 60,
      trace: traces.length ? traces.reduce((a, b) => a + b, 0) / traces.length : null,
      firstTry: tries.length ? tries.filter(Boolean).length / tries.length : null,
      recentTrace: ss.filter((s) => s.trace_accuracy != null).slice(-14).map((s) => s.trace_accuracy),
      recentTries: ss.filter((s) => s.first_try != null).slice(-14).map((s) => (s.first_try ? 1 : 0)),
      avgSeconds: ss.length ? ss.reduce((a, s) => a + (s.seconds || 0), 0) / ss.length : null,
      firstDate: first,
      curve,
      level: (WORDS[Math.min(p.cursor, WORDS.length - 1)] || WORDS[0]).level,
      stickers: p.stickers.length,
    };
  },
  weekDots(kid) {
    const days = new Set(this.sessions(kid).map((s) => s.session_date));
    const today = parseDate(localDate());
    const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    const names = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    return names.map((n, i) => {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const s = localDate(d);
      return { label: n, date: s, done: days.has(s), today: s === localDate() };
    });
  },
};

    const tune = gender === 'guy' ? (st.pitchGuy || 1) : (st.pitchGirl || 1);
    let voice = wanted ? voices.find((v) => v.voiceURI === wanted) : null;
    if (voice) return { voice, pitch: clamp(tune, 0.1, 2), shifted: false };
    const en = english();
    const matches = en.filter((v) => classify(v) === (gender === 'guy' ? 'male' : 'female')).sort(rank);
    if (matches.length) return { voice: matches[0], pitch: clamp((gender === 'guy' ? 0.95 : 1.08) * tune, 0.1, 2), shifted: false };

      if (opts.interrupt !== false) cancel();

      const gender = opts.gender || st.narrator || 'girl';
      const p = pick(gender);
      const u = new SpeechSynthesisUtterance(text);

    speak, spell, cancel, unlock, pick, classify,
    available: () => !!synth,
    list: () => english().slice().sort((a, b) => a.name.localeCompare(b.name)),

  };
})();

/* ---- 05-sound.js ---- */
/* ---------- sound effects, synthesized (nothing to download) ---------- */
const Sound = (() => {
  let ctx = null, master = null, noise = null;
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = Store.d.settings.volume == null ? 0.8 : Store.d.settings.volume;
      master.connect(ctx.destination);
      const len = ctx.sampleRate * 3;
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) { // soft "pink-ish" noise sounds more like people than hiss
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0526;
        data[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
      }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function setVolume(v) { if (master) master.gain.value = v; }
  function env(g, t, peak, attack, hold, release) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    g.gain.setValueAtTime(Math.max(peak, 0.0002), t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
  }
  function tone(freq, t, dur, { type = 'sine', gain = 0.25, slide = null, attack = 0.008 } = {}) {
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    env(g, t, gain, attack, dur * 0.25, dur * 0.75);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noiseBurst(t, dur, { freq = 1500, q = 1.2, gain = 0.3, type = 'bandpass' } = {}) {
    const c = ensure(); if (!c) return;
    const s = c.createBufferSource(); s.buffer = noise;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); env(g, t, gain, 0.003, dur * 0.2, dur * 0.8);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 2.5); s.stop(t + dur + 0.05);
  }
  const now = () => (ensure() ? ctx.currentTime + 0.02 : 0);

  function ding() {
    const t = now(); if (!ctx) return;
    tone(1046.5, t, 0.35, { gain: 0.22 });
    tone(1568, t + 0.09, 0.5, { gain: 0.18 });
    tone(2093, t + 0.18, 0.6, { gain: 0.08, type: 'triangle' });
  }
  function boing() {
    const t = now(); if (!ctx) return;
    tone(330, t, 0.32, { type: 'triangle', gain: 0.2, slide: 180 });
  }
  function pop() {
    const t = now(); if (!ctx) return;
    tone(600, t, 0.09, { gain: 0.18, slide: 1100 });
  }
  function tick() {
    const t = now(); if (!ctx) return;
    tone(1800, t, 0.05, { gain: 0.06, type: 'triangle' });
  }
  function stamp() {
    const t = now(); if (!ctx) return;
    tone(110, t, 0.22, { type: 'sine', gain: 0.5, slide: 55 });
    noiseBurst(t, 0.08, { freq: 600, q: 0.7, gain: 0.35 });
  }
  /* A happy crowd: fanfare, a "yaaay" swell, kids whistling "woo!" and a big round of applause. */
  function cheer() {
    const t = now(); if (!ctx) return 0;
    // fanfare
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.1, 0.16, { type: 'triangle', gain: 0.13 }));
    tone(1046.5, t + 0.42, 0.7, { type: 'triangle', gain: 0.12 });
    tone(1318.5, t + 0.42, 0.7, { type: 'triangle', gain: 0.09 });
    tone(783.99, t + 0.42, 0.7, { type: 'triangle', gain: 0.07 });
    // crowd "yay" (shaped noise through vowel-like filters, gently wobbling like many voices)
    [[750, 0.8, 0.5], [1250, 1.1, 0.32], [2600, 1.6, 0.12]].forEach(([freq, q, gain], k) => {
      const s = ctx.createBufferSource(); s.buffer = noise;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 4.5 + k * 1.7; lg.gain.value = freq * 0.12;
      lfo.connect(lg); lg.connect(f.frequency);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + 0.15);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.5);
      g.gain.setValueAtTime(gain, t + 1.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t + 0.15, Math.random()); s.stop(t + 2.9); lfo.start(t + 0.15); lfo.stop(t + 2.9);
    });
    // "woo!" whistles
    [[0.35, 950, 1900], [0.8, 1100, 2100], [1.25, 900, 1750]].forEach(([dt, a, b]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), vib = ctx.createOscillator(), vg = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(a, t + dt); o.frequency.exponentialRampToValueAtTime(b, t + dt + 0.25);
      o.frequency.exponentialRampToValueAtTime(b * 0.8, t + dt + 0.5);
      vib.frequency.value = 7; vg.gain.value = 30; vib.connect(vg); vg.connect(o.frequency);
      env(g, t + dt, 0.045, 0.05, 0.2, 0.3);
      o.connect(g); g.connect(master); o.start(t + dt); o.stop(t + dt + 0.6); vib.start(t + dt); vib.stop(t + dt + 0.6);
    });
    // applause: lots of little claps, densest in the middle
    for (let i = 0; i < 90; i++) {
      const u = Math.random();
      const dt = 0.2 + 2.4 * (u < 0.5 ? Math.sqrt(u / 2) : 1 - Math.sqrt((1 - u) / 2));
      noiseBurst(t + dt, 0.02 + Math.random() * 0.03, { freq: 900 + Math.random() * 2200, q: 1.4, gain: 0.08 + Math.random() * 0.12 });
    }
    return 2.8;
  }
  return { unlock: ensure, setVolume, ding, boing, pop, tick, stamp, cheer };
})();

    const steps = ['listen', 'warmup', 'trace', 'find'];
    if (kid.age >= 4) steps.push('build');
    this.s = { kid, word, practice, steps, i: 0, t0: performance.now(), traceScores: [], firstTry: null, buildErrors: null, reviewed: [] };
    go('#/lesson');
  },
  quit() { this.cleanupStep(); Speech.cancel(); this.s = null; go('#/kid'); },
  render(root) {
    const s = this.s;
    if (!s || s.finished) { this.s = null; go('#/kid', true); return; }
    this.root = h('div', { class: 'lesson' });
    const closeBtn = h('button', { class: 'icon-btn sm', 'aria-label': 'Stop lesson', html: icon('close', 24), onclick: () => this.confirmQuit() });
    this.dots = h('div', { class: 'steps', 'aria-hidden': 'true' }, s.steps.map(() => h('i')));
    const replay = h('button', { class: 'icon-btn sm', 'aria-label': 'Say it again', html: icon('speaker', 24), onclick: () => this.say && this.say() });
    this.body = h('main', { class: 'lesson-body' });
    const voice = (g) => h('button', { class: `voice-btn ${g}`, 'aria-label': `Hear ${s.word.w} in the ${g} voice`,
      onclick: (e) => this.hear(g, e.currentTarget) }, h('span', { class: 'face', html: g === 'guy' ? FACE_GUY : FACE_GIRL }), g === 'guy' ? 'Guy' : 'Girl');
    this.nextBtn = h('button', { class: 'btn leaf big', 'aria-label': 'Next', html: icon('next', 34), disabled: true, onclick: () => this.next() });
    root.append(this.root);
    this.root.append(
      h('div', { class: 'lesson-top' }, closeBtn, this.dots, replay),
      this.body,
      h('div', { class: 'lesson-bar' }, voice('guy'), voice('girl'), h('div', { class: 'spacer' }), this.nextBtn),
    );
    this.showStep();
  },
  async hear(gender, btn) {
    btn.classList.add('speaking');
    await Speech.speak(this.s.word.w, { gender, rate: 0.85 });
    btn.classList.remove('speaking');
  },
  confirmQuit() {
    Speech.cancel();
    modal({ title: 'Stop for now?', text: 'Today\'s word will be waiting.', buttons: [
      { label: 'Keep going', cls: 'leaf', value: false }, { label: 'Stop', cls: 'tomato', value: true },
    ] }).then((stop) => { if (stop) this.quit(); });
  },
  setDots() {
    $$('i', this.dots).forEach((d, k) => { d.className = k < this.s.i ? 'done' : k === this.s.i ? 'on' : ''; });
  },
  enableNext(pulse = true) { this.nextBtn.disabled = false; this.nextBtn.classList.toggle('pulse', pulse); },
  disableNext() { this.nextBtn.disabled = true; this.nextBtn.classList.remove('pulse'); },
  cleanupStep() { if (this.cleanup) { try { this.cleanup(); } catch (e) { /* ignore */ } this.cleanup = null; } },
  showStep() {
    this.cleanupStep();
    Speech.cancel();
    this.body.textContent = '';
    this.disableNext();
    this.say = null;
    this.setDots();
    const step = this.s.steps[this.s.i];
    this['step_' + step](this.body);
  },
  next() {
    if (!this.s) return;
    Sound.tick();
    if (this.s.i < this.s.steps.length - 1) { this.s.i++; this.showStep(); }
    else this.finish();
  },

  /* 1. look and listen */
  step_listen(body) {
    const w = this.s.word;
    const sheet = h('section', { class: 'sheet listen-sheet', 'aria-label': 'Look and listen' });
    const pic = h('div', { class: 'emoji listen-pic', 'aria-hidden': 'true' }, w.e);
    const wordBox = h('div', { class: 'listen-word', html: StrokeFont.wordSVG(w.w, { rules: true, stroke: 11 }) });
    const spellBtn = h('button', { class: 'btn small sun', html: `${icon('abc', 26)}<span>Spell it</span>` });
    sheet.append(pic, wordBox, h('div', { style: { marginTop: '10px' } }, spellBtn));
    body.append(sheet);
    const paint = (i) => $$('.lt', wordBox).forEach((g, k) => {
      const col = i === -1 || k === i ? (i === -1 ? '#26315C' : '#E8434F') : '#C3CBE0';
      const inner = g.lastElementChild;
      inner.setAttribute('stroke', col);
      $$('circle', inner).forEach((cc) => cc.setAttribute('fill', col));
    });
    let alive = true;
    this.cleanup = () => { alive = false; };
    const spell = async () => { await Speech.spell(w.w, { onLetter: (i) => alive && paint(i) }); if (alive) paint(-1); };
    spellBtn.onclick = () => spell();
    const intro = async () => {
      pic.classList.add('bounce');
      await Speech.speak('Our word today is', { rate: 1 });
      if (!alive) return;
      await Speech.speak(w.w, { rate: 0.8 });
      await sleep(250);
      if (!alive) return;
      await spell();
      if (alive) this.enableNext();
    };
    this.say = intro;
    intro();
    setTimeout(() => alive && this.enableNext(false), 6000);
  },

  /* 2. warm-up line, like the pre-writing pages */
  step_warmup(body) {
    const age = this.s.kid.age >= 4 ? 4 : 3;
    const list = WARMUPS[age];
    const wu = list[this.s.word.i % list.length];
    const wrap = h('div', { class: 'trace-wrap' });
    const head = h('div', { class: 'prompt' }, 'Warm up!');
    const host = h('div', { class: 'trace-host' });
    const sheet = h('section', { class: 'sheet', 'aria-label': 'Warm up tracing' }, wrap);
    const tools = this.traceTools(() => tracer.clear(), () => tracer.demo(), (c) => tracer.setColor(c));
    wrap.append(head, host, tools);
    body.append(sheet);
    const tracer = new Tracer(host, { kind: 'path', d: wu.d, from: wu.from, to: wu.to, age, ink: this.inkColor || CRAYONS[0],
      onComplete: () => {
        Sound.ding();
        Speech.speak(pickOne(['Yay!', 'You did it!', 'Super!']), { pitch: 1.05 });
        this.enableNext();
      } });
    this.cleanup = () => tracer.destroy();
    this.say = () => Speech.speak(wu.say);
    (async () => { await sleep(300); await Speech.speak(wu.say); tracer.demo(); })();
  },
  traceTools(onClear, onDemo, onColor) {
    const crayons = h('div', { class: 'crayons', role: 'group', 'aria-label': 'Pencil colour' });
    CRAYONS.forEach((c) => {
      const b = h('button', { style: { background: c }, 'aria-label': 'Pencil colour', 'aria-pressed': String(c === (this.inkColor || CRAYONS[0])) });
      b.onclick = () => { this.inkColor = c; onColor(c); $$('button', crayons).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); Sound.pop(); };
      crayons.append(b);
    });
    return h('div', { class: 'trace-tools' },
      h('button', { class: 'icon-btn', 'aria-label': 'Show me how', title: 'Show me how', html: icon('hand', 28), onclick: onDemo }),
      h('button', { class: 'icon-btn', 'aria-label': 'Start this one again', title: 'Start again', html: icon('redo', 28), onclick: () => { onClear(); Sound.pop(); } }),
      h('div', { class: 'spacer' }), crayons);
  },

  /* 3. trace the letters */
  step_trace(body) {
    const kid = this.s.kid, w = this.s.word.w;
    const mode = Kids.traceMode(kid);
    const units = mode === 'first' ? [{ text: w[0], at: 0 }] : mode === 'word' ? [{ text: w, at: -1 }] : [...w].map((ch, i) => ({ text: ch, at: i }));
    let u = 0, tracer = null, alive = true;
    const sheet = h('section', { class: 'sheet', 'aria-label': 'Trace' });
    const wrap = h('div', { class: 'trace-wrap' });
    const headWord = h('div', { class: 'mini' });
    const pages = h('div', { class: 'steps', style: { flex: '0 0 auto' } });
    const head = h('div', { class: 'trace-head' }, headWord, pages);
    const host = h('div', { class: 'trace-host' });
    const tools = this.traceTools(() => tracer && tracer.clear(), () => tracer && tracer.demo(), (c) => tracer && tracer.setColor(c));
    wrap.append(head, host, tools);
    sheet.append(wrap);
    body.append(sheet);
    const sayUnit = () => {
      const unit = units[u];
      return unit.text.length === 1 ? Speech.speak(`Trace the letter ${letterSay(unit.text)}`) : Speech.speak(`Trace the word ${unit.text}`);
    };
    const showUnit = () => {
      if (tracer) tracer.destroy();
      const unit = units[u];
      const colors = [...w].map((_, i) => (unit.at === -1 || i === unit.at ? '#E8434F' : '#C3CBE0'));
      headWord.innerHTML = StrokeFont.wordSVG(w, { stroke: 12, colors, pad: 4, cls: 'mini-word' });
      pages.textContent = '';
      if (units.length > 1) units.forEach((_, k) => pages.append(h('i', { class: k < u ? 'done' : k === u ? 'on' : '' })));
      tracer = new Tracer(host, { kind: 'glyphs', text: unit.text, age: kid.age, ink: this.inkColor || CRAYONS[0], onComplete: (st) => {
        this.s.traceScores.push(st.score);
        Sound.ding();
        if (u < units.length - 1) {
          Speech.speak(pickOne(['Nice!', 'Good!', 'Yes!']), { pitch: 1.05 });
          setTimeout(() => { if (!alive) return; u++; showUnit(); sayUnit().then(() => alive && tracer && tracer.demo()); }, 1100);
        } else {
          Speech.speak(pickOne(['Great tracing!', 'Beautiful letters!', 'Wow, nice tracing!']), { pitch: 1.05 });
          this.enableNext();
        }
      } });
    };
    showUnit();
    this.cleanup = () => { alive = false; if (tracer) tracer.destroy(); };
    this.say = () => sayUnit();
    (async () => { await sleep(300); await sayUnit(); if (alive && tracer) tracer.demo(); })();
  },

  /* 4. find the picture (plus a quick review of earlier words) */
  step_find(body) {
    const s = this.s, kid = s.kid;
    const count = kid.age >= 4 ? 3 : 2;
    const queue = [s.word, ...this.reviewWords(kid, s.word, kid.age >= 4 ? 2 : 1)];
    let q = 0, alive = true;
    const sheet = h('section', { class: 'sheet', 'aria-label': 'Find the picture' });
    body.append(sheet);
    this.cleanup = () => { alive = false; };
    const show = () => {
      const target = queue[q];
      const choices = shuffle([target, ...this.distractors(target, count - 1, kid)]);
      let wrongTaps = 0;
      sheet.textContent = '';
      const sayIt = () => Speech.speak(`Find the ${target.w}!`);
      this.say = sayIt;
      const promptEl = h('div', { class: 'prompt' }, h('span', null, 'Find the ', h('b', null, target.w)));
      const grid = h('div', { class: 'find-grid', style: { '--n': count }, dataset: { n: String(count) } });
      choices.forEach((c) => {
        const card = h('button', { class: 'pick-card', 'aria-label': c.w }, h('span', { class: 'pc-emoji emoji', 'aria-hidden': 'true' }, c.e));
        card.onclick = async () => {
          if (!alive || card.classList.contains('faded')) return;
          if (c === target) {
            $$('.pick-card', grid).forEach((x) => { if (x !== card) x.classList.add('faded'); x.disabled = true; });
            card.classList.add('right', 'bounce');
            Sound.ding();
            if (q === 0) s.firstTry = wrongTaps === 0;
            else s.reviewed.push({ w: target.w, ok: wrongTaps === 0 });
            await Speech.speak(`Yes! ${target.w}!`, { pitch: 1.05 });
            await sleep(350);
            if (!alive) return;
            if (q < queue.length - 1) { q++; show(); sayIt2(); } else this.next();
          } else {
            wrongTaps++;
            card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
            Sound.boing();
            await Speech.speak(`That's a ${c.w}. Find the ${target.w}!`);
          }
        };
        grid.append(card);
      });
      const parts = [promptEl, grid];
      if (q > 0) parts.unshift(h('div', { class: 'review-tag' }, 'Remember this one?'));
      sheet.append(...parts);
    };
    const sayIt2 = () => Speech.speak(`Find the ${queue[q].w}!`);
    show();
    setTimeout(() => alive && sayIt2(), 250);
  },
  reviewWords(kid, word, n) {
    const learned = Stats.learnedWords(kid).filter((x) => x.w !== word.w);
    if (!learned.length) return [];
    const today = localDate();
    const want = [1, 3, 7, 14, 30];
    const scored = learned.map((x) => {
      const age = daysBetween(x.d, today);
      const near = Math.min(...want.map((d) => Math.abs(d - age)));
      return { x, near: near + Math.random() * 0.5 };
    }).sort((a, b) => a.near - b.near);
    return scored.slice(0, n).map((o) => WORD_INDEX[o.x.w]).filter(Boolean);
  },
  distractors(target, n, kid) {
    const learned = Stats.learnedSet(kid);
    const pool = WORDS.filter((x) => x.w !== target.w && x.e !== target.e && x.w[0] !== target.w[0]);
    const near = pool.filter((x) => Math.abs(x.level - target.level) <= 1 || learned.has(x.w));
    return shuffle(near.length >= n ? near : pool).slice(0, n);
  },

  /* 5. build the word from letter tiles (age 4) */
  step_build(body) {
    const s = this.s, w = s.word.w;
    s.buildErrors = 0;
    let pos = 0, alive = true;
    const sheet = h('section', { class: 'sheet', 'aria-label': 'Build the word' });
    const slots = h('div', { class: 'slots' });
    [...w].forEach((_, i) => slots.append(h('div', { class: 'slot' + (i === 0 ? ' next' : '') })));
    const alphabet = 'abcdefghijklmnoprstuvwyz'.split('').filter((ch) => !w.includes(ch));
    const letters = shuffle([...w, pickOne(alphabet)]);
    const tiles = h('div', { class: 'tiles-row' });
    letters.forEach((ch) => {
      const t = h('button', { class: 'letter-tile', 'aria-label': `letter ${ch}` }, ch);
      t.onclick = async () => {
        if (!alive || t.classList.contains('used') || pos >= w.length) return;
        if (ch === w[pos]) {
          t.classList.add('used');
          const slot = slots.children[pos];
          slot.textContent = ch; slot.classList.remove('next'); slot.classList.add('bounce');
          pos++;
          if (slots.children[pos]) slots.children[pos].classList.add('next');
          Sound.pop();
          if (pos === w.length) {
            Sound.ding();
            await Speech.spell(w);
            await sleep(300);
            if (alive) this.next();
          } else Speech.speak(letterSay(ch));
        } else {
          s.buildErrors++;
          t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
          Sound.boing();
          Speech.speak(`Not ${letterSay(ch)}. Find ${letterSay(w[pos])}.`);
        }
      };
      tiles.append(t);
    });
    sheet.append(h('div', { class: 'prompt' }, 'Build the word'), h('div', { class: 'emoji build-pic', 'aria-hidden': 'true' }, s.word.e), slots, tiles);
    body.append(sheet);
    this.cleanup = () => { alive = false; };
    this.say = () => Speech.speak(`Build the word ${w}. Tap the letters in order.`);
    setTimeout(() => alive && this.say(), 250);
  },

  /* finish: record, cheer, sticker */
  finish() {
    const s = this.s;
    if (!s || s.finished) return;
    s.finished = true;
    this.cleanupStep();
    const trace = s.traceScores.length ? s.traceScores.reduce((a, b) => a + b, 0) / s.traceScores.length : null;
    const ft = s.firstTry !== false;
    const be = s.buildErrors || 0;
    const t = trace == null ? 1 : trace;
    let stars = 1;
    if (t >= 0.85 && ft && be <= 1) stars = 3;
    else if (t >= 0.7 && (ft || be <= 2)) stars = 2;
    const seconds = Math.min(1800, (performance.now() - s.t0) / 1000);
    const { sticker } = Plan.complete(s.kid, s.word, { practice: s.practice, stars, trace, firstTry: s.firstTry, buildErrors: s.buildErrors, seconds });
    this.celebrate({ stars, sticker });
  },
  celebrate({ stars, sticker }) {
    const s = this.s, kid = s.kid, word = s.word;
    const ov = h('div', { class: 'celebrate', role: 'dialog', 'aria-label': 'Great job' });
    const canvas = h('canvas', { class: 'confetti' });
    const starRow = h('div', { class: 'star-row', 'aria-label': `${stars} of 3 stars` });
    for (let i = 0; i < 3; i++) starRow.append(h('div', { html: STAR_SVG(i < stars), style: { opacity: '0' } }));
    const stampWrap = h('div', { class: 'stamp-wrap', html: STAMP_100 });
    const buttons = h('div', { class: 'row' });
    const done = (hash) => { Speech.cancel(); ov.remove(); this.s = null; go(hash); };
    if (WORD_PAGE[word.w]) buttons.append(h('button', { class: 'btn grape', html: `${icon('palette', 26)}<span>Colour the ${word.w}</span>`, onclick: () => done('#/paint/' + WORD_PAGE[word.w]) }));
    buttons.append(h('button', { class: 'btn sun', html: `${icon('home', 26)}<span>Home</span>`, onclick: () => done('#/kid') }));
    const parts = [canvas, h('h1', { class: 'big-title' }, 'Great job!'), stampWrap, starRow];
    if (sticker) {
      parts.push(h('div', { class: 'sticker-reveal' },
        h('div', { class: 'sticker emoji', 'aria-hidden': 'true' }, sticker[0]),
        h('div', { style: { textAlign: 'left' } }, h('div', { style: { fontFamily: 'var(--f-display)', fontWeight: 800, fontSize: '20px' } }, 'New sticker!'), h('div', { style: { color: 'var(--ink-2)' } }, `A ${sticker[1]} for your book`))));
    }
    parts.push(buttons);
    ov.append(...parts);
    $('#overlay-root').append(ov);
    this.root && (this.root.style.visibility = 'hidden');
    confetti(canvas);
    Sound.cheer();
    setTimeout(() => Speech.speak(`Great job, ${kid.name}!`, { pitch: 1.08, rate: 1.05 }), 380);
    $('.stamp100', stampWrap).classList.add('in');
    setTimeout(() => Sound.stamp(), 120);
    [...starRow.children].forEach((st, i) => setTimeout(() => { if (i < stars) Sound.tick(); st.style.opacity = '1'; st.firstChild.classList.add('pop'); }, 700 + i * 260));
    const onHash = () => { ov.remove(); window.removeEventListener('hashchange', onHash); };
    window.addEventListener('hashchange', onHash);
  },
};

function confetti(canvas, ms = 3400) {
  if (prefersReducedMotion()) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const c = canvas.getContext('2d'); c.scale(dpr, dpr);
  const cols = ['#F37370', '#FFC43D', '#4CC27A', '#3DA5F5', '#A58BFA', '#FF9CC8'];
  const parts = Array.from({ length: 150 }, () => ({
    x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 2.2, vy: 2 + Math.random() * 3.5,
    r: 5 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, col: pickOne(cols), sh: Math.random() < 0.6 ? 0 : 1,
  }));
  const t0 = performance.now();
  const frame = (t) => {
    if (!canvas.isConnected) return;
    c.clearRect(0, 0, W, H);
    const fade = clamp(1 - (t - t0 - ms + 800) / 800, 0, 1);
    c.globalAlpha = fade;
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr; p.vx *= 0.995;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col;
      if (p.sh) { c.beginPath(); c.arc(0, 0, p.r * 0.55, 0, Math.PI * 2); c.fill(); } else c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      c.restore();
    }
    if (t - t0 < ms) requestAnimationFrame(frame); else c.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(frame);
}

/* ---- 09-art.js ---- */
/* ---------- colouring pages: original vector line art (600 x 750, prints at any size) ---------- */
const Art = (() => {
  const K = '#1E1E1E';
  const f = (n) => (Math.round(n * 10) / 10).toString();
  const wrap = (body, defs = '') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"><defs>${defs}</defs><rect width="600" height="750" fill="#ffffff"/><g fill="#ffffff" stroke="${K}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">${body}</g></svg>`;
  const P = (d, x = '') => `<path d="${d}" ${x}/>`;
  const C = (cx, cy, r, x = '') => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" ${x}/>`;
  const E = (cx, cy, rx, ry, x = '') => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" ${x}/>`;
  const L = (d, w) => `<path d="${d}" fill="none"${w ? ` stroke-width="${w}"` : ''}/>`;
  const D = `fill="${K}"`;
  const mirror = (body) => `<g transform="translate(600 0) scale(-1 1)">${body}</g>`;
  const rot = (deg, cx, cy, body) => `<g transform="rotate(${deg} ${cx} ${cy})">${body}</g>`;

  function eye(x, y, r = 20, lx = 0, ly = 2) {
    return C(x, y, r) + C(x + lx, y + ly, r * 0.56, D) +
      `<circle cx="${f(x + lx - r * 0.2)}" cy="${f(y + ly - r * 0.24)}" r="${f(r * 0.19)}" fill="#fff" stroke="none"/>`;
  }
  function dotEye(x, y, r = 9) {
    return C(x, y, r, D) + `<circle cx="${f(x - r * 0.3)}" cy="${f(y - r * 0.32)}" r="${f(r * 0.32)}" fill="#fff" stroke="none"/>`;
  }
  function smoothClosed(pts) {
    const n = pts.length;
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + 'Z';
  }
  function smoothOpen(pts) {
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  }
  function blob(cx, cy, r, seed, n = 7, jit = 0.28, sx = 1, sy = 1) {
    const rnd = seeded(seed);
    const pts = [];
    for (let i = 0; i < n; i++) {

    }
    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    const img = this.cctx.getImageData(minX, minY, bw, bh);
    this.pushUndo(minX, minY, new ImageData(new Uint8ClampedArray(img.data), bw, bh));
    const [r, g, b] = hexRGB(this.currentColor());
    const d = img.data;
    for (let y = 0; y < bh; y++) {
      let i = (minY + y) * W + minX, p = y * bw * 4;
      for (let x = 0; x < bw; x++, i++, p += 4) {
        if (mask[i]) { d[p] = r; d[p + 1] = g; d[p + 2] = b; d[p + 3] = 255; }
      }
    }
    this.cctx.putImageData(img, minX, minY);
    this.changed();
    return true;
  }
  changed() {
    this.dirty = true;
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.save(), 700);
    if (this.onChange) this.onChange();
  }
  composite(width) {
    const w = width || this.W, hgt = Math.round(w * 1.25);
    const c = document.createElement('canvas'); c.width = w; c.height = hgt;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, hgt);
    x.drawImage(this.colorCv, 0, 0, w, hgt); x.drawImage(this.lineCv, 0, 0, w, hgt);
    return c;
  }
  save() {
    this.dirty = false;
    const thumb = this.composite(240).toDataURL('image/jpeg', 0.82);
    return new Promise((res) => {
      this.colorCv.toBlob((blob) => { IDB.set('page:' + this.pageId, { color: blob, thumb, t: Date.now() }).then(res); }, 'image/png');
    });
  }
  downloadPicture() {
    this.composite().toBlob((blob) => downloadFile(`kwords-${this.pageId}.png`, blob), 'image/png');
  }
}

/* ---- 11-cloud.js ---- */
/* ---------- optional database (Supabase) ----------
   Sends only: a random family id, a random child id, the age group and lesson numbers.
   Names, avatars and artwork stay on the device. Calls go to SQL functions defined in
   kwords-setup.sql; tables are locked so nobody can read other families' rows. */
const Cloud = {
  enabled() { return !!(CONFIG.supabaseUrl && CONFIG.supabaseKey); },
  flushing: false,
  lastError: null,
  async rpc(fn, args) {
    if (!this.enabled()) throw new Error('Database not connected');
    const headers = { 'Content-Type': 'application/json', apikey: CONFIG.supabaseKey };
    if (/^eyJ/.test(CONFIG.supabaseKey)) headers.Authorization = 'Bearer ' + CONFIG.supabaseKey; // legacy anon JWT
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 15000) : null;
    try {
      const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args || {}), signal: ctrl ? ctrl.signal : undefined });
      const text = await res.text();
      if (!res.ok) {
        let msg = text;
        try { const j = JSON.parse(text); msg = j.message || j.hint || text; } catch (e) { /* plain text */ }
        const err = new Error(msg || `HTTP ${res.status}`); err.status = res.status; throw err;
      }
      return text ? JSON.parse(text) : null;
    } finally { if (timer) clearTimeout(timer); }
  },
  push(item) { Store.d.outbox.push(item); Store.save(); this.flush(); },
  queueKid(kid) { if (!this.enabled()) return; this.push({ t: 'kid', kid: kid.id, age: kid.age }); },
  queueSession(kid, s) { if (!this.enabled()) return; this.push({ t: 'session', kid: kid.id, age: kid.age, s }); },
  queueDelete(kidId) { if (!this.enabled()) return; this.push({ t: 'delete', kid: kidId }); },
  queueFeedback(local) { this.push({ t: 'feedback', id: local.id, f: local }); },
  pending() { return Store.d.outbox.length; },
  drop(items) { Store.d.outbox = Store.d.outbox.filter((x) => !items.includes(x)); },
  flush() {
    if (!this.enabled() || navigator.onLine === false) return Promise.resolve();
    if (this.running) return this.running;
    this.running = this.flushNow().finally(() => { this.running = null; });
    return this.running;
  },
  async flushNow() {
    this.flushing = true;
    try {
      while (Store.d.outbox.length) {
        const item = Store.d.outbox[0];
        if (item.t === 'delete') {
          await this.rpc('kw_delete_kid', { p_family: Store.d.familyId, p_kid: item.kid });
          this.drop([item]);
        } else if (item.t === 'kid' || item.t === 'session') {
          const kid = Kids.get(item.kid);
          const sent = [];
          for (const x of Store.d.outbox) {
            if (x.kid !== item.kid || (x.t !== 'session' && x.t !== 'kid')) break;
            sent.push(x);
            if (sent.length >= 50) break;
          }
          const batch = sent.filter((x) => x.t === 'session').map((x) => x.s);
          await this.rpc('kw_log_sessions', { p_family: Store.d.familyId, p_kid: item.kid, p_age: kid ? kid.age : item.age, p_sessions: batch });
          this.drop(sent);
        } else if (item.t === 'feedback') {
          const f = item.f;
          const id = await this.rpc('kw_submit_feedback', { p_family: Store.d.familyId, p_category: f.category, p_title: f.title, p_details: f.details || null, p_email: f.email || null });
          const local = Store.d.feedback.find((x) => x.id === item.id);
          if (local) local.remoteId = id;
          this.drop([item]);
        } else {
          this.drop([item]);
        }
        Store.save();
      }
      this.lastError = null;
    } catch (e) {
      this.lastError = e.message;
      console.warn('[kwords] sync paused:', e.message);
      if (e.status === 400 && Store.d.outbox[0]) { // a row the server will never accept: set it aside instead of blocking the queue
        const bad = Store.d.outbox[0];
        this.drop([bad]);
        console.warn('[kwords] dropped an item the database rejected', bad);
        Store.save();
      }
    } finally { this.flushing = false; }
  },
  async compare(kid) {
    await this.flush();
    const r = await this.rpc('kw_compare', { p_family: Store.d.familyId, p_kid: kid.id });
    Store.d.compare[kid.id] = { at: Date.now(), data: r };
    Store.save();
    return r;
  },
  myFeedback() { return this.rpc('kw_my_feedback', { p_family: Store.d.familyId }); },
  board() { return this.rpc('kw_board', { p_family: Store.d.familyId }); },
  vote(id) { return this.rpc('kw_vote', { p_family: Store.d.familyId, p_feedback: id }); },
  adminReport(pass) { return this.rpc('kw_admin_report', { p_pass: pass }); },
  adminUpdate(pass, id, status, note) { return this.rpc('kw_admin_update_feedback', { p_pass: pass, p_id: id, p_status: status, p_note: note || null }); },
};
window.addEventListener('online', () => Cloud.flush());
