/* ---------- small SVG charts for the grown-up area ----------
   Thin marks, hairline grid, legend + direct end labels, crosshair tooltip, and a table view. */
const Charts = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  /* clean whole-number axis steps: 1, 2, 5, 10, 20, 25, 50 ... */
  function scale(maxVal, target = 4) {
    const v = Math.max(1, maxVal);
    const raw = v / target;
    const p = 10 ** Math.floor(Math.log10(raw));
    let step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((c) => c >= raw - 1e-9);
    if (step < 1) step = 1;
    if (!Number.isInteger(step)) step = Math.ceil(step);
    const top = Math.ceil(v / step - 1e-9) * step;
    const ticks = [];
    for (let t = 0; t <= top + 1e-9; t += step) ticks.push(t);
    return { max: top, ticks };
  }
  const tickFmt = (v) => fmtNum(v, Number.isInteger(v) ? 0 : 1);
  function responsive(holder, draw) {
    let lastW = 0;
    const ro = new ResizeObserver(() => {
      const w = Math.round(holder.getBoundingClientRect().width);
      if (w && Math.abs(w - lastW) > 4) { lastW = w; draw(w); }
    });
    ro.observe(holder);
    return ro;
  }
  function tableToggle(rowsFn, cols) {
    const box = h('div');
    const btn = h('button', { class: 'table-toggle', type: 'button' }, 'Show as a table');
    const holder = h('div', { class: 'table-scroll', hidden: true });
    btn.onclick = () => {
      holder.hidden = !holder.hidden;
      btn.textContent = holder.hidden ? 'Show as a table' : 'Hide table';
      if (!holder.hidden && !holder.firstChild) {
        const t = h('table', { class: 'g-table' }, h('thead', null, h('tr', null, cols.map((c) => h('th', null, c)))), h('tbody', null, rowsFn().map((r) => h('tr', null, r.map((v) => h('td', null, v))))));
        holder.append(t);
      }
    };
    box.append(btn, holder);
    return box;
  }
  function tooltip(container) {
    const t = h('div', { class: 'tooltip', hidden: true });
    container.append(t);
    return {
      show(x, y, head, rows) {
        t.textContent = '';
        t.append(h('div', { class: 't-head' }, head));
        rows.forEach((r) => t.append(h('div', { class: 't-row' }, h('span', { class: 't-key', style: { background: r.color } }), h('b', null, r.value), h('span', null, r.name))));
        t.hidden = false;
        const cw = container.getBoundingClientRect().width;
        const tw = t.offsetWidth;
        t.style.left = clamp(x, tw / 2 + 2, cw - tw / 2 - 2) + 'px';
        t.style.top = (y - 10) + 'px';
      },
      hide() { t.hidden = true; },
    };
  }

  /* series: [{name, color, points:[[x,y]...], dash}] */
  function line({ series, height = 230, xFmt = (x) => x, yFmt = (y) => y, xTitle = '', tableCols, tableX = xFmt }) {
    const box = h('div');
    if (series.length > 1) {
      box.append(h('div', { class: 'legend' }, series.map((s) => h('span', null, h('i', { style: { background: s.color, height: s.dash ? '0' : '3px', borderTop: s.dash ? `3px dashed ${s.color}` : '0' } }), s.name))));
    }
    const holder = h('div', { class: 'chart' });
    box.append(holder);
    const tip = tooltip(holder);
    const draw = (W) => {
      $$('svg', holder).forEach((s) => s.remove());
      const m = { l: 34, r: 92, t: 12, b: xTitle ? 40 : 26 };
      const H = height;
      const all = series.flatMap((s) => s.points);
      if (!all.length) return;
      const xs = [...new Set(all.map((p) => p[0]))].sort((a, b) => a - b);
      const x0 = xs[0], x1 = Math.max(xs[xs.length - 1], x0 + 1);
      const sc = scale(Math.max(...all.map((p) => p[1])));
      const ymax = sc.max;
      const X = (x) => m.l + ((x - x0) / (x1 - x0)) * (W - m.l - m.r);
      const Y = (y) => m.t + (1 - y / ymax) * (H - m.t - m.b);
      const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' });
      sc.ticks.forEach((v) => {
        svg.append(el('line', { class: v === 0 ? 'axis' : 'grid', x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }));
        const t = el('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }); t.textContent = tickFmt(v); svg.append(t);
      });
      const xsc = scale(x1 - x0, W < 420 ? 4 : 6);
      xsc.ticks.filter((v) => x0 + v <= x1).forEach((v) => {
        const t = el('text', { x: X(x0 + v), y: H - m.b + 16, 'text-anchor': 'middle' }); t.textContent = xFmt(x0 + v); svg.append(t);
      });
      if (xTitle) { const t = el('text', { x: (m.l + W - m.r) / 2, y: H - 4, 'text-anchor': 'middle' }); t.textContent = xTitle; svg.append(t); }
      const ends = [];
      series.forEach((s) => {
        if (!s.points.length) return;
        const d = s.points.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ');
        svg.append(el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': s.dash ? '6 5' : 'none' }));
        const last = s.points[s.points.length - 1];
        ends.push({ s, x: X(last[0]), y: Y(last[1]), v: last[1] });
      });
      ends.sort((a, b) => a.y - b.y);
      ends.forEach((e, i) => { e.ly = i === 0 ? e.y : Math.max(e.y, ends[i - 1].ly + 30); });
      const maxLy = H - m.b - 14;
      for (let i = ends.length - 1; i >= 0; i--) {
        if (ends[i].ly > maxLy) ends[i].ly = maxLy;
        if (i < ends.length - 1 && ends[i + 1].ly - ends[i].ly < 30) ends[i].ly = ends[i + 1].ly - 30;
      }
      ends.forEach((e) => {
        if (Math.abs(e.ly - e.y) > 3) svg.append(el('line', { x1: e.x + 6, y1: e.y, x2: e.x + 12, y2: e.ly, stroke: '#C9CFD9', 'stroke-width': 1 }));
        svg.append(el('circle', { cx: e.x, cy: e.y, r: 4.5, fill: e.s.color, stroke: '#fff', 'stroke-width': 2 }));
        const t1 = el('text', { x: e.x + 14, y: e.ly - 2, class: 'end-label' }); t1.textContent = yFmt(e.v);
        const t2 = el('text', { x: e.x + 14, y: e.ly + 13 }); t2.textContent = e.s.short || e.s.name;
        svg.append(t1, t2);
      });
      const cross = el('line', { y1: m.t, y2: H - m.b, stroke: '#9AA3B5', 'stroke-width': 1, visibility: 'hidden' });
      const dots = series.map((s) => { const c = el('circle', { r: 4.5, fill: s.color, stroke: '#fff', 'stroke-width': 2, visibility: 'hidden' }); return c; });
      svg.append(cross, ...dots);
      const hit = el('rect', { x: m.l, y: m.t, width: Math.max(1, W - m.l - m.r), height: H - m.t - m.b, fill: 'transparent', tabindex: 0, 'aria-label': 'Chart, use the table view for exact values' });
      const valueAt = (s, xv) => { let v = null; for (const p of s.points) { if (p[0] <= xv) v = p[1]; else break; } return v; };
      const move = (clientX) => {
        const r = svg.getBoundingClientRect();
        const px = ((clientX - r.left) / r.width) * W;
        let best = xs[0];
        for (const xv of xs) if (Math.abs(X(xv) - px) < Math.abs(X(best) - px)) best = xv;
        cross.setAttribute('x1', X(best)); cross.setAttribute('x2', X(best)); cross.setAttribute('visibility', 'visible');
        const rows = [];
        series.forEach((s, i) => {
          const v = valueAt(s, best);
          if (v == null) { dots[i].setAttribute('visibility', 'hidden'); return; }
          dots[i].setAttribute('cx', X(best)); dots[i].setAttribute('cy', Y(v)); dots[i].setAttribute('visibility', 'visible');
          rows.push({ name: s.name, value: yFmt(v), color: s.color });
        });
        tip.show((X(best) / W) * r.width, (m.t / H) * r.height + 4, xFmt(best, true), rows);
      };
      const leave = () => { cross.setAttribute('visibility', 'hidden'); dots.forEach((d) => d.setAttribute('visibility', 'hidden')); tip.hide(); };
      hit.addEventListener('pointermove', (e) => move(e.clientX));
      hit.addEventListener('pointerdown', (e) => move(e.clientX));
      hit.addEventListener('pointerleave', leave);
      hit.addEventListener('focus', () => { const r = svg.getBoundingClientRect(); move(r.left + (X(xs[xs.length - 1]) / W) * r.width); });
      hit.addEventListener('blur', leave);
      svg.append(hit);
      holder.prepend(svg);
    };
    responsive(holder, draw);
    if (tableCols) {
      box.append(tableToggle(() => {
        const xsAll = [...new Set(series.flatMap((s) => s.points.map((p) => p[0])))].sort((a, b) => a - b);
        return xsAll.map((xv) => [tableX(xv), ...series.map((s) => { const p = s.points.find((q) => q[0] === xv); return p ? yFmt(p[1]) : '–'; })]);
      }, tableCols));
    }
    return box;
  }

  /* bars: [{label, value, hi, tip}] */
  function columns({ bars, height = 200, color = '#2a78d6', dim = '#C9CFD9', yFmt = (v) => v, labelEvery = 1, tableCols, title }) {
    const box = h('div');
    const holder = h('div', { class: 'chart' });
    box.append(holder);
    const tip = tooltip(holder);
    const draw = (W) => {
      $$('svg', holder).forEach((s) => s.remove());
      const m = { l: 30, r: 8, t: 18, b: 26 };
      const H = height;
      const sc = scale(Math.max(...bars.map((b) => b.value), 1), 3);
      const ymax = sc.max;
      const band = (W - m.l - m.r) / Math.max(1, bars.length);
      const bw = Math.max(3, Math.min(24, band - 2));
      const Y = (v) => m.t + (1 - v / ymax) * (H - m.t - m.b);
      const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': title || 'Bar chart' });
      sc.ticks.forEach((v) => {
        svg.append(el('line', { class: v === 0 ? 'axis' : 'grid', x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }));
        const t = el('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }); t.textContent = tickFmt(v); svg.append(t);
      });
      const anyHi = bars.some((b) => b.hi);
      bars.forEach((b, i) => {
        const x = m.l + band * i + (band - bw) / 2, y = Y(b.value), hgt = Y(0) - y;
        const r = Math.min(4, bw / 2, hgt);
        const fill = anyHi ? (b.hi ? color : dim) : color;
        if (hgt > 0.5) {
          const d = `M${x} ${Y(0)} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y} H${x + bw - r} A${r} ${r} 0 0 1 ${x + bw} ${y + r} V${Y(0)} Z`;
          svg.append(el('path', { d, fill }));
        }
        if (b.hi) { const t = el('text', { x: x + bw / 2, y: y - 6, 'text-anchor': 'middle', class: 'end-label' }); t.textContent = b.hiLabel || yFmt(b.value); svg.append(t); }
        if (i % labelEvery === 0) { const t = el('text', { x: x + bw / 2, y: H - m.b + 16, 'text-anchor': 'middle' }); t.textContent = b.label; svg.append(t); }
        const hit = el('rect', { x: m.l + band * i, y: m.t, width: band, height: H - m.t - m.b, fill: 'transparent', tabindex: 0 });
        const show = () => { const rr = svg.getBoundingClientRect(); tip.show(((x + bw / 2) / W) * rr.width, (Math.min(y, H - m.b - 20) / H) * rr.height, b.tipHead || b.label, [{ name: b.tipName || '', value: yFmt(b.value), color: fill }]); };
        hit.addEventListener('pointerenter', show); hit.addEventListener('pointerdown', show); hit.addEventListener('focus', show);
        hit.addEventListener('pointerleave', () => tip.hide()); hit.addEventListener('blur', () => tip.hide());
        svg.append(hit);
      });
      holder.prepend(svg);
    };
    responsive(holder, draw);
    if (tableCols) box.append(tableToggle(() => bars.map((b) => [b.tipHead || b.label, yFmt(b.value)]), tableCols));
    return box;
  }

  function spark(values, { color = '#2a78d6', w = 120, hgt = 30, max = 1 } = {}) {
    if (!values || values.length < 2) return h('span');
    const X = (i) => 2 + (i / (values.length - 1)) * (w - 6), Y = (v) => 3 + (1 - v / max) * (hgt - 6);
    const d = values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    const last = values[values.length - 1];
    return svgNode(`<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true" style="margin-top:6px"><path d="${d}" fill="none" stroke="#AEB6C4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(values.length - 1)}" cy="${Y(last)}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/></svg>`);
  }
  return { line, columns, spark };
})();

async function parentGate() {
  if (Date.now() < (View.gateUntil || 0)) return true;
  const a = 3 + Math.floor(Math.random() * 6), b = 3 + Math.floor(Math.random() * 6);
  const ans = a * b;
  const opts = new Set([ans]);
  while (opts.size < 3) opts.add(ans + pickOne([-a, a, -b, b, 2, -2, 10]));
  const choice = await modal({ title: 'Grown-ups only', text: 'Tap the answer to continue.', big: `${a} × ${b} = ?`,
    buttons: [...shuffle([...opts]).map((v) => ({ label: String(v), cls: 'sea', value: v })), { label: 'Cancel', cls: '', value: null }] });
  if (choice === ans) { View.gateUntil = Date.now() + 10 * 60 * 1000; return true; }
  if (choice != null) toast('Not quite. Ask a grown-up to help.');
  return false;
}

/* add / edit a child (kid-styled, used by onboarding and settings) */
function kidForm(kid, { onDone, submitLabel = 'Save' } = {}) {
  const st = kid ? Stats.forKid(kid) : null;
  const data = { name: kid ? kid.name : '', age: kid ? kid.age : 4, avatar: kid ? kid.avatar : AVATARS[0][0], level: kid ? kid.level || 1 : 1, traceMode: kid ? kid.traceMode || 'auto' : 'auto' };
  const name = h('input', { class: 'input', maxlength: 24, placeholder: 'First name or nickname', 'aria-label': 'Child’s name', autocomplete: 'off', value: data.name });
  const choiceRow = (opts, key) => {
    const row = h('div', { class: 'choice-row' });
    opts.forEach(([v, label]) => {
      const b = h('button', { type: 'button', class: 'choice', 'aria-pressed': String(data[key] === v) }, label);
      b.onclick = () => { data[key] = v; $$('button', row).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); Sound.tick(); };
      row.append(b);
    });
    return row;
  };
  const avatars = h('div', { class: 'avatar-grid', role: 'group', 'aria-label': 'Pick an animal' });
  AVATARS.forEach(([e, col]) => {
    const b = h('button', { type: 'button', class: 'emoji', style: { background: col }, 'aria-pressed': String(e === data.avatar), 'aria-label': 'Avatar' }, e);
    b.onclick = () => { data.avatar = e; $$('button', avatars).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); Sound.pop(); };
    avatars.append(b);
  });
  const err = h('p', { class: 'g-note', role: 'status', style: { color: 'var(--stamp)', margin: '0 0 10px' } });
  const form = h('form', { novalidate: true },
    h('label', { class: 'field' }, h('span', null, 'Name'), name),
    h('div', { class: 'field' }, h('span', null, 'Age'), choiceRow([[3, '3 years'], [4, '4 years']], 'age')),
    h('div', { class: 'field' }, h('span', null, 'Pick an animal'), avatars),
    (!st || st.words === 0) ? h('div', { class: 'field' }, h('span', null, 'Start with'), choiceRow([[1, '3 letters'], [2, '4 letters'], [3, '5 letters']], 'level')) : null,
    kid ? h('div', { class: 'field' }, h('span', null, 'Tracing'), choiceRow([['auto', 'By age'], ['first', 'First letter'], ['each', 'Each letter'], ['word', 'Whole word']], 'traceMode'),
      h('small', { style: { color: 'var(--ink-2)' } }, 'By age: first letter at 3, each letter at 4. Whole word works best on a tablet.')) : null,
    err,
    h('button', { class: 'btn sun block', type: 'submit' }, submitLabel));
  form.onsubmit = (e) => {
    e.preventDefault();
    const n = name.value.trim();
    if (!n) { err.textContent = 'Add a name so the app can cheer for them.'; name.focus(); return; }
    let saved;
    if (kid) { Kids.update(kid.id, { name: n.slice(0, 24), age: data.age, avatar: data.avatar, level: data.level, traceMode: data.traceMode }); saved = Kids.get(kid.id); }
    else saved = Kids.add({ name: n, age: data.age, avatar: data.avatar, level: data.level });
    if (onDone) onDone(saved);
  };
  return form;
}
function kidFormModal(kid) {
  return new Promise((resolve) => {
    const back = h('div', { class: 'modal-back' });
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', style: { textAlign: 'left', maxHeight: '92vh', overflowY: 'auto' } });
    const close = (v) => { back.remove(); resolve(v); };
    box.append(h('div', { class: 'g-row', style: { marginBottom: '10px' } }, h('h2', { style: { flex: 1, margin: 0 } }, kid ? `Edit ${kid.name}` : 'Add a child'),
      h('button', { class: 'icon-btn sm', 'aria-label': 'Close', html: icon('close', 22), onclick: () => close(null) })),
    kidForm(kid, { onDone: (k) => close(k), submitLabel: kid ? 'Save' : 'Add child' }));
    back.append(box);
    back.addEventListener('click', (e) => { if (e.target === back) close(null); });
    $('#overlay-root').append(back);
    const first = $('input', box); if (first) setTimeout(() => first.focus(), 50);
  });
}

      h('button', { class: 'g-btn', html: `${icon('download', 18)}<span>Children (CSV)</span>`, onclick: () => downloadFile(`kwords-children-${localDate()}.csv`, toCSV(kids), 'text/csv') }),
      h('button', { class: 'g-btn', html: `${icon('download', 18)}<span>Feedback (CSV)</span>`, onclick: () => downloadFile(`kwords-feedback-${localDate()}.csv`, toCSV(d.feedback || []), 'text/csv') })));
    body.append(kidCard);
  },
  inbox(items, sample) {
    const card = h('section', { class: 'g-card' }, h('h2', null, 'Feature requests'),
      h('p', { class: 'sub' }, 'New ideas stay private. Mark one Planned, Being built or Done to show it on the parents’ idea board.'));
    let filter = 'all';
    const list = h('div');
    const filters = Grown.seg([['all', 'All'], ['new', 'New'], ['planned', 'Planned'], ['building', 'Building'], ['done', 'Done'], ['declined', 'Not planned']], 'all', (v) => { filter = v; draw(); });
    const draw = () => {
      list.textContent = '';
      const shown = items.filter((f) => filter === 'all' || f.status === filter);
      if (!shown.length) { list.append(h('p', { class: 'g-note', style: { marginTop: '12px' } }, 'Nothing here.')); return; }
      shown.forEach((f) => {
        const sel = h('select', { class: 'g-select', style: { width: 'auto' }, 'aria-label': 'Status' },
          [['new', 'Received'], ['planned', 'Planned'], ['building', 'Being built'], ['done', 'Done'], ['declined', 'Not planned']].map(([v, l]) => h('option', { value: v }, l)));
        sel.value = f.status;
        const note = h('input', { class: 'g-input', placeholder: 'Reply shown to parents (optional)', maxlength: 1000, value: f.admin_note || '' });
        const saveBtn = h('button', { class: 'g-btn primary' }, 'Save');
        saveBtn.onclick = async () => {
          if (sample) { f.status = sel.value; f.admin_note = note.value; toast('Sample data: nothing was saved.'); draw(); return; }
          saveBtn.disabled = true;
          try { await Cloud.adminUpdate(this.pass, f.id, sel.value, note.value); f.status = sel.value; f.admin_note = note.value; toast('Saved.'); draw(); }
          catch (e) { toast(`Couldn’t save: ${e.message}`); saveBtn.disabled = false; }
        };
        const catLabel = { idea: 'New feature', words: 'Words & lessons', colouring: 'Colouring', problem: 'Problem', other: 'Other' }[f.category] || f.category;
        list.append(h('div', { class: 'inbox-item' },
          h('div', { class: 'g-row', style: { flexWrap: 'wrap' } }, h('b', { style: { flex: 1 } }, f.title), Grown.badge(f.status)),
          h('div', { class: 'meta' }, `${catLabel}, ${niceDate(String(f.created_at).slice(0, 10))}, ${f.votes || 0} votes${f.email ? `, ${f.email}` : ''}`),
          f.details ? h('div', { class: 'details' }, f.details) : null,
          h('div', { class: 'inbox-actions' }, sel, note, saveBtn)));
      });
    };
    card.append(h('div', { style: { overflowX: 'auto' } }, filters), list);
    draw();
    return card;
  },
};

function sampleReport() {
  const rnd = seeded('kwords-sample');
  const today = localDate();
  const kids = [];
  for (let i = 0; i < 140; i++) {
    const age = rnd() < 0.45 ? 3 : 4;
    const joined = Math.floor(rnd() * 70);
    const keen = 0.35 + rnd() * 0.6;
    const days = Math.max(1, Math.round(joined * keen * (age === 4 ? 0.8 : 0.7)));
    kids.push({ kid: Math.floor(rnd() * 0xffffffff).toString(16).padStart(8, '0'), age, words: Math.min(106, Math.round(days * (0.9 + rnd() * 0.2))), days,
      trace: Math.min(0.98, (age === 4 ? 0.72 : 0.62) + rnd() * 0.24), first_try: Math.min(1, (age === 4 ? 0.78 : 0.68) + rnd() * 0.22),
      stars: days * 2, minutes: days * 6, last_day: addDays(today, -Math.floor(rnd() * Math.min(joined + 1, 20))), joined: addDays(today, -joined) });
  }
  const by = [3, 4].map((age) => {
    const ks = kids.filter((k) => k.age === age);
    const avg = (f) => ks.reduce((a, k) => a + k[f], 0) / ks.length;
    return { age, kids: ks.length, active7: ks.filter((k) => daysBetween(k.last_day, today) < 7).length, words: avg('words'), days: avg('days'), trace: avg('trace'), first_try: avg('first_try') };
  });
  const hist = [];
  kids.forEach((k) => { const bin = Math.floor(k.words / 5) * 5; const e = hist.find((x) => x.age === k.age && x.bin === bin); if (e) e.kids++; else hist.push({ age: k.age, bin, kids: 1 }); });
  const curve = (pace) => Array.from({ length: 61 }, (_, d) => [d, Math.round(d * pace * (1 - d / 400) * 100) / 100, 50]);
  const daily = Array.from({ length: 30 }, (_, i) => { const day = addDays(today, i - 29); const k = Math.round(38 + i * 0.9 + (rnd() - 0.5) * 14 - (parseDate(day).getDay() % 6 === 0 ? 8 : 0)); return { day, kids: k, lessons: Math.round(k * 1.2) }; });
  const fb = [
    ['Add French words', 'words', 'Our daughter is in French immersion. A French word list would be amazing.', 'planned', 14],
    ['Let kids record their own voice', 'idea', 'So they can hear themselves say the word next to the guy and girl voices.', 'new', 0],
    ['More dinosaur colouring pages', 'colouring', '', 'building', 9],
    ['Weekly email summary for parents', 'idea', 'A short email on Sundays with words learned.', 'new', 0],
    ['Tracing is hard on a small phone', 'problem', 'The 5-letter words get small. Maybe bigger letters?', 'done', 6],
  ].map(([title, category, details, status, votes], i) => ({ id: i + 1, title, category, details, status, votes, email: i === 1 ? 'parent@example.com' : null, admin_note: status === 'done' ? 'Letters are now traced one at a time on phones.' : null, created_at: addDays(today, -i * 3) }));
  return {
    generated_at: new Date().toISOString(), default_pass: false,
    totals: { families: 112, kids: kids.length, active7: by.reduce((a, b) => a + b.active7, 0), active30: 118, lessons7: 486, lessons: 5240, feedback_new: fb.filter((f) => f.status === 'new').length },
    by_age: by, hist, curves: { 3: curve(0.62), 4: curve(0.74) }, daily, feedback: fb,
    kids: kids.sort((a, b) => (a.last_day < b.last_day ? 1 : -1)),
  };
}

/* ---- 15-screens.js ---- */
/* ---------- shared modal ---------- */
function modal({ title, text, big, buttons = [{ label: 'OK', cls: 'sun', value: true }] }) {
  return new Promise((resolve) => {
    const back = h('div', { class: 'modal-back' });
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
    const close = (v) => { back.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    box.append(h('h2', null, title));
    if (text) box.append(h('p', null, text));
    if (big) box.append(h('div', { class: 'gate-q' }, big));
    const row = h('div', { class: 'row' });
    buttons.forEach((b) => row.append(h('button', { class: `btn ${b.cls || ''}`, onclick: () => close(b.value) }, b.label)));
    box.append(row);
    back.append(box);
    back.addEventListener('click', (e) => { if (e.target === back) close(null); });
    document.addEventListener('keydown', onKey);
    $('#overlay-root').append(back);
    setTimeout(() => { const f = $('button', row); if (f) f.focus(); }, 30);
  });
}

/* ---- 16-main.js ---- */
/* ---------- routing & start-up ---------- */
const View = { cleanup: null, gateUntil: 0 };

function go(hash, replace) {
  if (replace) { history.replaceState(null, '', hash); render(); return; }
  if (location.hash === hash) render(); else location.hash = hash;
}

async function render() {
  if (View.cleanup) { try { View.cleanup(); } catch (e) { /* ignore */ } View.cleanup = null; }
  Lesson.cleanupStep();
  Speech.cancel();
  const app = $('#app');
  app.textContent = '';
  $('#overlay-root').textContent = '';
  window.scrollTo(0, 0);
  const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
  const route = parts[0] || '';
  const grownRoute = route === 'grown' || route === 'internal';
  if (!Kids.all().length && !grownRoute) { Screens.welcome(app); return; }
  if (grownRoute) {
    if (Date.now() >= (View.gateUntil || 0)) {
      const ok = await parentGate();
      if (!ok) { go(Kids.active() ? '#/kid' : '#/', true); return; }
      app.textContent = '';
    }
    if (route === 'grown') Grown.render(app, parts[1]); else Internal.render(app);
    return;
  }
  switch (route) {
    case '': Screens.picker(app); break;
    case 'kid': Screens.kidHome(app); break;
    case 'lesson': Lesson.render(app); View.cleanup = () => { Lesson.cleanupStep(); Speech.cancel(); }; break;
    case 'colour': parts[1] ? Colouring.renderBook(app, parts[1]) : Colouring.renderShelf(app); break;
    case 'paint': Colouring.renderPaint(app, parts[1]); break;
    case 'stickers': Screens.stickers(app); break;
    case 'welcome': Screens.welcome(app); break;
    default: go('#/kid', true);
  }
}

function boot() {
  Store.load();
  document.title = CONFIG.appName;
  const unlock = () => { Sound.unlock(); Speech.unlock(); };
  window.addEventListener('pointerdown', unlock, { once: true, capture: true });
  window.addEventListener('keydown', unlock, { once: true, capture: true });
  window.addEventListener('hashchange', render);
  document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.cancel(); });
  render();
  if (Cloud.enabled()) { // ideas saved before feedback was switched on
    const queued = new Set(Store.d.outbox.filter((x) => x.t === 'feedback').map((x) => x.id));
    Store.d.feedback.filter((f) => !f.remoteId && !queued.has(f.id)).forEach((f) => Store.d.outbox.push({ t: 'feedback', id: f.id, f }));
    Store.save();
  }
  setTimeout(() => Cloud.flush(), 1200);
  window.__kw = { Store, Kids, Plan, Stats, Lesson, Cloud, Art, WORDS, Speech, Sound, StrokeFont, render, go };
}
boot();
